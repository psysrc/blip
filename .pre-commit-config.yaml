repos:
  - repo: local
    hooks:
      - id: ruff check
        name: Ruff Check
        language: system
        entry: poetry run ruff check --fix
        types: [python]

      - id: ruff format
        name: Ruff Format
        language: system
        entry: poetry run ruff format
        types: [python]

      - id: pyright
        name: Pyright
        language: system
        entry: poetry run pyright
        types: [python]
        pass_filenames: false

      - id: pytest
        name: Unit Tests
        language: system
        entry: poetry run pytest test/unit/
        types: [python]
        pass_filenames: false
