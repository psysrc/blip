[project]
name = "blip"
version = "0.1.0"
description = "A Domain Specific Language for parsing and manipulating string data."
authors = [
    {name = "psysrc"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.6"
pytest-cov = "^6.1.1"
pre-commit = "^4.2.0"
pyinstaller = "^6.14.2"
markdown-it-py = "^3.0.0"
pyright = "^1.1.414"

[tool.pytest.ini_options]
# Put the repository root on sys.path, so that `test.common` always resolves to this project's
# test package and never to the standard library's `test` package, which some Python builds ship.
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.pyright]
include = ["blip.py", "bliplib", "test"]
exclude = ["venv", ".venv", "build", "**/__pycache__"]

# The lowest version this project supports, so that newer-only syntax is caught
pythonVersion = "3.12"

typeCheckingMode = "standard"
