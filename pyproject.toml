[project]
name = "blip"
version = "0.1.0"
description = "Blip is a Domain Specific Language (DSL) for parsing and manipulating string data."
authors = [
    {name = "psysrc"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.6"

[tool.ruff]
line-length = 120
