[project]
name = "blip"
version = "0.1.0"
description = "A Domain Specific Language for parsing and manipulating string data."
authors = [
    {name = "psysrc"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
ruff = "^0.11.6"
pytest-cov = "^6.1.1"
pre-commit = "^4.2.0"
pyinstaller = "^6.14.2"
markdown-it-py = "^3.0.0"

[tool.ruff]
line-length = 140
